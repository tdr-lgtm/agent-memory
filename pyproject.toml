[project]
name = "agent-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]
